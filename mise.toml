# Local tooling and tasks. Requires: mise, podman (rootful via sudo).
# Usage: mise tasks | mise run vm base | mise run iso xps16-da16260

[tools]
cosign = "3.1.4"

[env]
FEDORA_VERSION = "45"
BOOTC_REGISTRY = "ghcr.io/ysantalla"

[tasks.build]
description = "Build an image into root's storage (machine images build the local base first if missing)"
usage = 'arg "[image]" help="base or a machine image under images/" default="base"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
image="${usage_image?}"
args=(--build-arg "FEDORA_VERSION=$FEDORA_VERSION" --build-arg "BUILD_DATE=$(date -u +%Y%m%d)")
if [[ "$image" != "base" ]]; then
  sudo podman image exists "localhost/base:$FEDORA_VERSION" || mise run build base
  args+=(--build-arg BASE_IMAGE=localhost/base)
fi
sudo podman build "${args[@]}" \
  -t "localhost/$image:$FEDORA_VERSION" -t "localhost/$image:latest" "images/$image"
'''

[tasks.disk]
description = "Build an image and turn it into a disk: qcow2 or anaconda-iso"
usage = '''
arg "[image]" default="base"
arg "[type]" help="qcow2 or anaconda-iso" default="qcow2"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
image="${usage_image?}"
type="${usage_type?}"
mise run build "$image"
mkdir -p "output/$image"
if [[ ! -f bib/config.toml ]]; then
  echo "Missing bib/config.toml. Copy bib/config.example.toml and set your own password" >&2
  exit 1
fi
sudo podman run --rm -it --privileged --pull=newer \
  --security-opt label=type:unconfined_t \
  -v "./output/$image:/output" \
  -v ./bib/config.toml:/config.toml:ro \
  -v /var/lib/containers/storage:/var/lib/containers/storage \
  quay.io/centos-bootc/bootc-image-builder:latest \
  --type "$type" --rootfs btrfs "localhost/$image:latest"
'''

[tasks.vm]
description = "qcow2 disk for test VMs"
usage = 'arg "[image]" default="base"'
run = 'mise run disk "${usage_image?}" qcow2'

[tasks.vm-up]
description = "Boot the test VM. Creates its throwaway copy only if it is missing"
usage = '''
arg "[image]" default="base"
flag "--gl" help="OpenGL through the host GPU. Video decode stays in software"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="output/${usage_image?}"
disk="$dir/qcow2/disk.qcow2"
test -f "$disk" || { echo "Missing $disk. Run: mise run vm $usage_image" >&2; exit 1; }
# QEMU holds a write lock on the disk, however it was started
if [[ -f "$dir/vm-test.qcow2" ]] && ! qemu-img info "$dir/vm-test.qcow2" >/dev/null 2>&1; then
  echo "This VM is already running" >&2
  exit 1
fi
if [[ "$disk" -nt "$dir/vm-test.qcow2" && -f "$dir/vm-test.qcow2" ]]; then
  echo "$disk was rebuilt, so this VM's copy is stale. Run: mise run vm-reset $usage_image" >&2
  exit 1
fi
if [[ ! -f "$dir/vm-test.qcow2" ]]; then
  qemu-img create -f qcow2 -F qcow2 -b "$PWD/$disk" "$dir/vm-test.qcow2"
  cp /usr/share/edk2/ovmf/OVMF_VARS.fd "$dir/vm-vars.fd"
fi
video=(-device virtio-vga,xres=1920,yres=1080 -display gtk,zoom-to-fit=off)
if [[ "${usage_gl:-false}" == "true" ]]; then
  video=(-device virtio-vga-gl,xres=1920,yres=1080 -display gtk,gl=on,zoom-to-fit=off)
fi
GDK_BACKEND=x11 GDK_SCALE=1 exec qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 4G \
  -drive if=pflash,format=raw,readonly=on,file=/usr/share/edk2/ovmf/OVMF_CODE.fd \
  -drive if=pflash,format=raw,file="$dir/vm-vars.fd" \
  -drive file="$dir/vm-test.qcow2",if=virtio \
  -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22 \
  -audiodev pipewire,id=snd0 -device ich9-intel-hda -device hda-output,audiodev=snd0 \
  "${video[@]}"
'''

[tasks.vm-reset]
description = "Erase the test VM's copy, including its home directory. The built disk stays"
usage = 'arg "[image]" default="base"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="output/${usage_image?}"
if [[ ! -f "$dir/vm-test.qcow2" ]]; then
  echo "$dir has no VM copy" >&2
  exit 0
fi
if ! qemu-img info "$dir/vm-test.qcow2" >/dev/null 2>&1; then
  echo "Shut this VM down first" >&2
  exit 1
fi
if [[ ! -t 0 ]]; then
  echo "Run this from a terminal: it asks for confirmation" >&2
  exit 1
fi
read -r -p "Erase $dir/vm-test.qcow2 and everything in that VM? [y/N] " answer
[[ "$answer" == [yY] ]] || exit 0
rm -f "$dir/vm-test.qcow2" "$dir/vm-vars.fd"
'''

[tasks.iso]
description = "Installer ISO. It may erase the target disk: not for machines with data"
usage = 'arg "[image]" default="base"'
run = 'mise run disk "${usage_image?}" anaconda-iso'

[tasks.switch-local]
description = "Switch THIS machine to the local build (no registry)"
usage = 'arg "<image>" help="required, so a missing name never moves a machine to base"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run build "${usage_image?}"
sudo bootc switch --transport containers-storage "localhost/${usage_image}:latest"
'''

[tasks.switch]
description = "Switch THIS machine to the published image, requiring its signature"
usage = 'arg "<image>" help="required, so a missing name never moves a machine to base"'
run = 'sudo bootc switch --enforce-container-sigpolicy "$BOOTC_REGISTRY/${usage_image?}:latest"'

[tasks.clean]
description = "Remove generated disks and every test VM, after asking"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[[ -d output ]] || exit 0
for copy in output/*/vm-test.qcow2; do
  [[ -f "$copy" ]] || continue
  if ! qemu-img info "$copy" >/dev/null 2>&1; then
    echo "A VM is running on $copy. Shut it down first" >&2
    exit 1
  fi
done
if [[ ! -t 0 ]]; then
  echo "Run this from a terminal: it asks for confirmation" >&2
  exit 1
fi
read -r -p "Erase output/, with every disk and test VM? [y/N] " answer
[[ "$answer" == [yY] ]] || exit 0
sudo rm -rf output
'''
