name: pinned downloads

# shell.sh pins Starship and the Nerd Font by version and checksum, which is right for a build
# but means nothing says when a newer release exists. Once a week this compares them and keeps
# one issue open while any is behind. It changes no file: a new version gets a new checksum by hand.
on:
  schedule:
    - cron: "15 9 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: Pinned downloads have newer releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pins with the latest releases
        id: pins
        run: |
          set -o pipefail # a failed lookup must fail the step, not look like "all current"
          tests/check-pins.sh | tee outdated.txt
          echo "count=$(wc -l < outdated.txt)" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue
        env:
          COUNT: ${{ steps.pins.outputs.count }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [[ "$COUNT" -eq 0 ]]; then
            [[ -n "$number" ]] && gh issue close "$number" --comment "All pins are current again."
            exit 0
          fi
          {
            echo "\`images/base/build_files/shell.sh\` pins these, and a newer release exists:"
            echo
            echo "| Download | Pinned | Latest |"
            echo "|---|---|---|"
            while read -r line; do
              url=${line##* }; rest=${line% *}
              latest=${rest##* }; rest=${rest% *}
              pinned=${rest##* }; name=${rest% *}
              echo "| [$name]($url) | $pinned | $latest |"
            done < outdated.txt
            echo
            echo "To update one: read its release notes, change the version in \`shell.sh\`, download the"
            echo "file that script fetches, and put its \`sha256sum\` beside the version. \`tests/smoke.sh\`"
            echo "checks that the prompt and the font still work."
          } > body.md
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
