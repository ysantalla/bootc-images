name: reusable image build

on:
  workflow_call:
    inputs:
      image:
        description: Image name (also the folder under images/)
        required: true
        type: string
      fedora_version:
        required: true
        type: string
      push:
        required: true
        type: boolean
    secrets:
      SIGNING_SECRET:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Before the build: machine images pull FROM our base on GHCR.
      - name: Log in to GHCR
        if: inputs.push
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          context: images/${{ inputs.image }}
          containerfiles: images/${{ inputs.image }}/Containerfile
          image: ${{ inputs.image }}
          tags: >-
            latest
            ${{ inputs.fedora_version }}
            ${{ inputs.fedora_version }}-${{ steps.meta.outputs.date }}
          build-args: FEDORA_VERSION=${{ inputs.fedora_version }}
          oci: false

      - name: Push
        id: push
        if: inputs.push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}

      - uses: sigstore/cosign-installer@v3
        if: inputs.push

      - name: Sign with cosign
        if: inputs.push
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${{ steps.meta.outputs.registry }}/${{ inputs.image }}@${{ steps.push.outputs.digest }}"
