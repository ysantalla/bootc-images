name: reusable image build

on:
  workflow_call:
    inputs:
      image:
        description: Image name (also the folder under images/)
        required: true
        type: string
      fedora_version:
        required: true
        type: string
      build_date:
        description: YYYYMMDD, shared by every image of one run
        required: true
        type: string
      from_image:
        description: The image this one builds FROM, without a tag. Empty skips the signature check
        required: false
        type: string
        default: ""
      from_key:
        description: Public key that must have signed from_image
        required: false
        type: string
        default: ""
      push:
        required: true
        type: boolean
      rechunk:
        description: Split the image into one layer per package group, so updates only download what changed
        required: false
        type: boolean
        default: false
      machine_image:
        description: Also build and test this machine image FROM the local build, without publishing it
        required: false
        type: string
        default: ""
    secrets:
      SIGNING_SECRET:
        required: false
      COSIGN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Metadata
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Before the build: machine images pull FROM our base on GHCR.
      - name: Log in to GHCR
        if: inputs.push
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned: machines enforcing signatures were tested against this version's
      # .sig format. Test that again before moving to another major version.
      # Also runs on PRs, so an update to this action is exercised before it merges.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      # The build uses exactly the copy verified here: it is pulled by digest, and
      # the build steps never pull (--pull=never).
      - name: Verify and pull the image this one builds FROM
        if: inputs.from_image != ''
        env:
          FROM: ${{ inputs.from_image }}
          KEY: ${{ inputs.from_key }}
          VERSION: ${{ inputs.fedora_version }}
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$FROM:$VERSION")
          cosign verify --key "$KEY" "$FROM@$digest" > /dev/null
          podman pull "$FROM@$digest"
          podman tag "$FROM@$digest" "$FROM:$VERSION"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          context: images/${{ inputs.image }}
          containerfiles: images/${{ inputs.image }}/Containerfile
          image: ${{ inputs.image }}
          tags: >-
            latest
            ${{ inputs.fedora_version }}
            ${{ inputs.fedora_version }}-${{ inputs.build_date }}
          build-args: |
            FEDORA_VERSION=${{ inputs.fedora_version }}
            BUILD_DATE=${{ inputs.build_date }}
          oci: false
          # v3 squashes by default, and machines would download the whole image on every update
          squash: false
          extra-args: --pull=never

      # Uses the rpm-ostree inside the image, so no other tool has to be pulled and verified.
      # --previous-build keeps the layout of the published image, so unchanged packages
      # keep the same layers. Its file times are zero, so the result is reproducible.
      - name: Rechunk
        if: inputs.rechunk
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.fedora_version }}
          BUILD_DATE: ${{ inputs.build_date }}
          PREVIOUS: docker://${{ steps.meta.outputs.registry }}/${{ inputs.image }}:${{ inputs.fedora_version }}
        run: |
          image="localhost/$IMAGE:$VERSION"
          raw="localhost/$IMAGE:raw"
          podman tag "$image" "$raw"
          graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          # --rootfs drops the image config, so the labels are passed again
          mapfile -t labels < <(podman inspect "$raw" --format '{{json .Labels}}' | jq -r '
            del(."ostree.commit", ."ostree.final-diffid", ."rpmostree.inputhash", ."quay.expires-after")
            | to_entries[] | "--label=\(.key)=\(.value)"')
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="$raw",target=/rootfs \
            --mount=type=bind,src="$graphroot",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree "$raw" \
            compose build-chunked-oci --bootc --format-version=2 --max-layers 200 \
              --rootfs /rootfs --previous-build "$PREVIOUS" "${labels[@]}" \
              --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]$image"
          podman tag "$image" "localhost/$IMAGE:latest" "localhost/$IMAGE:$VERSION-$BUILD_DATE"
          podman rmi "$raw"
          podman image prune -f
          podman inspect "$image" --format '{{len .RootFS.Layers}} layers'
          podman run --rm --network=none "$image" bootc container lint
          df -h /

      - name: Test the image
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.fedora_version }}
          BUILD_DATE: ${{ inputs.build_date }}
        run: |
          label=$(podman inspect "localhost/$IMAGE:$VERSION" --format '{{index .Labels "org.opencontainers.image.version"}}')
          test "$label" = "$VERSION.$BUILD_DATE"
          podman run --rm --network=none -v "$PWD/tests:/tests:ro" "localhost/$IMAGE:$VERSION" bash /tests/smoke.sh "$IMAGE"

      - name: Build the machine image
        if: inputs.machine_image != ''
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          context: images/${{ inputs.machine_image }}
          containerfiles: images/${{ inputs.machine_image }}/Containerfile
          image: ${{ inputs.machine_image }}
          tags: ${{ inputs.fedora_version }}
          build-args: |
            FEDORA_VERSION=${{ inputs.fedora_version }}
            BUILD_DATE=${{ inputs.build_date }}
            BASE_IMAGE=localhost/${{ inputs.image }}
          oci: false
          squash: false
          extra-args: --pull=never

      - name: Test the machine image
        if: inputs.machine_image != ''
        env:
          IMAGE: ${{ inputs.machine_image }}
          VERSION: ${{ inputs.fedora_version }}
        run: podman run --rm --network=none -v "$PWD/tests:/tests:ro" "localhost/$IMAGE:$VERSION" bash /tests/smoke.sh "$IMAGE"

      # Only the staging tag is pushed here. Machines follow latest, which moves
      # to this digest only after its signature is verified, so a failed signing
      # leaves them on the previous signed image.
      - name: Tag for staging
        if: inputs.push
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.fedora_version }}
        run: podman tag "localhost/$IMAGE:$VERSION" "localhost/$IMAGE:staging"

      - name: Push to the staging tag
        id: push
        if: inputs.push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: staging
          registry: ${{ steps.meta.outputs.registry }}

      - name: Sign with cosign and verify the result
        if: inputs.push
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REF: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          echo "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF"
          cosign verify --key cosign.pub "$REF" > /dev/null

      # --preserve-digests keeps the signed manifest, so every tag carries the signature
      - name: Move the published tags to the signed image
        if: inputs.push
        env:
          REPO: ${{ steps.meta.outputs.registry }}/${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.build.outputs.tags }}
        run: |
          for tag in $TAGS; do
            skopeo copy --preserve-digests "docker://$REPO@$DIGEST" "docker://$REPO:$tag"
          done
          for tag in $TAGS; do
            test "$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:$tag")" = "$DIGEST"
          done
          cosign verify --key cosign.pub "$REPO:latest" > /dev/null
