name: build images

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "30 8 * * *" # daily, after Universal Blue's builds
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel pull request runs. On main, a run cancelled between push and
  # cosign sign would leave :latest published without a signature.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    outputs:
      # One date for the whole run, so a build that crosses midnight UTC keeps matching tags
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck tests/*.sh images/*/build_files/*.sh images/*/system_files/usr/libexec/bootc-images/*.sh
      - name: TOML
        run: python3 -c "import tomllib; tomllib.load(open('mise.toml','rb')); tomllib.load(open('bib/config.example.toml','rb'))"
      - name: The image ships the published signing key
        run: cmp cosign.pub images/base/system_files/usr/share/bootc-images/cosign.pub

  base:
    needs: lint
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image: base
      fedora_version: "45"
      build_date: ${{ needs.lint.outputs.date }}
      from_image: ghcr.io/ublue-os/kinoite-main
      from_key: .github/keys/ublue-os.pub
      push: ${{ github.event_name != 'pull_request' }}
      rechunk: true
      # A pull request publishes nothing, so machine images build FROM this local base.
      machine_image: ${{ github.event_name == 'pull_request' && 'xps16-da16260' || '' }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # Builds FROM the base just pushed, so it waits for it.
  xps16-da16260:
    needs: [lint, base]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image: xps16-da16260
      fedora_version: "45"
      build_date: ${{ needs.lint.outputs.date }}
      from_image: ghcr.io/ysantalla/base
      from_key: cosign.pub
      push: true
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
