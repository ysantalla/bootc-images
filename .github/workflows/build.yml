name: build images

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  schedule:
    - cron: "30 8 * * *" # daily, after Universal Blue's builds
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel pull request runs. On main, a run cancelled between push and
  # cosign sign would leave :latest published without a signature.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    outputs:
      # One date for the whole run, so a build that crosses midnight UTC keeps matching tags
      date: ${{ steps.date.outputs.date }}
      # A pull request that only touches documentation builds no image
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its parents, to list what it changes
          fetch-depth: 2
      # Documentation is docs/ and the Markdown files at the root. A README under images/ is
      # shipped in the image, so it does not count.
      - id: docs
        name: Is this a pull request of documentation only?
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if [[ -n "$changed" ]] && ! grep -qvE '^(docs/.*|[^/]+\.md)$' <<<"$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed: the image build is skipped."
          fi
      - name: shellcheck
        run: shellcheck tests/*.sh images/*/build_files/*.sh images/*/build_files/*/build.sh images/*/system_files/usr/libexec/katze/*.sh images/*/system_files/usr/lib/tuned/profiles/*/script.sh images/base/system_files/usr/bin/zed
      - name: Python parses
        run: git ls-files -z '*.py' | xargs -0 python3 -c "import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]"
      - name: TOML
        run: python3 -c "import tomllib; tomllib.load(open('mise.toml','rb')); tomllib.load(open('bib/config.example.toml','rb'))"
      - name: The image ships the published signing key
        run: cmp cosign.pub images/base/system_files/usr/share/katze/cosign.pub

  base:
    needs: lint
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image: base
      fedora_version: "45"
      build_date: ${{ needs.lint.outputs.date }}
      from_image: ghcr.io/ublue-os/kinoite-main
      from_key: .github/keys/ublue-os.pub
      # Only main publishes: a pull request, or a manual run on another branch, builds and tests.
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      rechunk: true
      docs_only: ${{ needs.lint.outputs.docs_only == 'true' }}
      # A run that publishes nothing builds machine images FROM this local base.
      machine_image: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'xps16-da16260' || '' }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # The XPS's infrared camera driver, for the kernel of the base just pushed. On a pull request
  # it is only compiled, against the published base.
  module:
    needs: [lint, base]
    if: needs.lint.outputs.docs_only != 'true'
    uses: ./.github/workflows/module.yml
    permissions:
      contents: read
    with:
      fedora_version: "45"
      sign: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets:
      MODULE_KEY: ${{ secrets.MODULE_KEY }}
      MODULE_KEY_PASSWORD: ${{ secrets.MODULE_KEY_PASSWORD }}

  # Builds FROM the base just pushed, so it waits for it. Also runs when the module failed.
  xps16-da16260:
    needs: [lint, base, module]
    if: ${{ !cancelled() && needs.base.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image: xps16-da16260
      fedora_version: "45"
      build_date: ${{ needs.lint.outputs.date }}
      from_image: ghcr.io/ysantalla/base
      from_key: cosign.pub
      push: true
      module: ${{ needs.module.result == 'success' && 'hm1092' || '' }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
