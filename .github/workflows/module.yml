name: kernel module

# Builds the XPS's infrared camera driver for the kernel of our published base and signs it with
# the owner's module key, which that machine's Secure Boot accepts. A failure here never stops
# the image: it is then built without the module.
on:
  workflow_call:
    inputs:
      fedora_version:
        required: true
        type: string
      sign:
        required: true
        type: boolean
    # Normally empty, as in reusable-build.yml: they are secrets of the `signing` environment
    secrets:
      MODULE_KEY:
        required: false
      MODULE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # Runs code from outside this repository (RPM scriptlets, the compiler), so it never sees the key
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - name: Build for the kernel of the base image
        env:
          FROM: ghcr.io/${{ github.repository_owner }}/base
          VERSION: ${{ inputs.fedora_version }}
        run: |
          from=${FROM,,}
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$from:$VERSION")
          cosign verify --key cosign.pub "$from@$digest" > /dev/null
          mkdir out
          podman run --rm -v "$PWD/images/xps16-da16260/build_files:/ctx:ro" -v "$PWD/out:/out" "$from@$digest" bash -ec '
            kernel=$(rpm -q kernel-core --qf "%{version}-%{release}.%{arch}")
            /ctx/hm1092.sh "$kernel" /out/hm1092.ko'
          modinfo out/hm1092.ko
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hm1092-unsigned
          path: out/hm1092.ko
          if-no-files-found: error
          retention-days: 1

  # Gets the key, and runs nothing but openssl and our script on what the build left
  sign:
    needs: build
    if: inputs.sign
    runs-on: ubuntu-24.04
    environment: signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hm1092-unsigned
      - name: Sign with the module key
        env:
          MODULE_KEY: ${{ secrets.MODULE_KEY }}
          MODULE_KEY_PASSWORD: ${{ secrets.MODULE_KEY_PASSWORD }}
        run: |
          [[ -n "$MODULE_KEY" ]] || { echo "::error::MODULE_KEY is not in the signing environment"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/module.key"
          trap 'shred -u "$key"' EXIT
          printf '%s\n' "$MODULE_KEY" > "$key"
          python3 -I .github/scripts/sign-module.py hm1092.ko images/xps16-da16260/build_files/hm1092/module-key.der "$key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hm1092
          path: hm1092.ko
          if-no-files-found: error
          retention-days: 1
