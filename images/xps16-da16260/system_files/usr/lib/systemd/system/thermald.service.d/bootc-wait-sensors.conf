# thermald only supports Panther Lake in adaptive mode. If it starts before the sensors exist,
# it falls back to the other mode, which refuses this CPU, and stays down until the next boot.
# Adapted from onuralpszr/xps-fedora (dell-xps-ptl-config, commit 98e8400).
[Unit]
After=systemd-modules-load.service

[Service]
ExecStartPre=/usr/libexec/bootc-images/thermald-wait.sh
