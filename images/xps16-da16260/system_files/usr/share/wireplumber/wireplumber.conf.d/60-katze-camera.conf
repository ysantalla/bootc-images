# WirePlumber does not offer libcamera's cameras: katze-camera.service does, from its own process.
# Asked for 1080p or less, libcamera picks a sensor mode this machine rejects and aborts,
# and inside WirePlumber that takes the sound down with it.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

# The image processor's raw nodes are not cameras an application can use
monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "ipu7" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
