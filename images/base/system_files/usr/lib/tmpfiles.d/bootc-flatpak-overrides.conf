# System-wide Flatpak overrides. Created only if missing, so local changes are kept.
d /var/lib/flatpak/overrides 0755 root root -
f /var/lib/flatpak/overrides/com.slack.Slack 0644 root root - [Context]\nsockets=wayland;\n
f /var/lib/flatpak/overrides/org.onlyoffice.desktopeditors 0644 root root - [Environment]\nGTK_USE_PORTAL=1\n
f /var/lib/flatpak/overrides/dev.zed.Zed 0644 root root - [Environment]\nZED_WINDOW_DECORATIONS=server\n
