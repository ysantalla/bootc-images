# Katze Mono: the choices behind each icon. See README.md.
#
# [aliases] gives an application a glyph. The key is the application's Icon=
# value, or its desktop file name without ".desktop" when the icon is a path
# or several launchers share it. The value names a file in glyphs/ (without
# ".svg") or an icon of Breeze (22 px, one colour).
#
# Check a name before adding it: `katze-mono.py --report` warns about any
# alias that finds nothing.

[aliases]
# Brands: the application's own mark, from glyphs/. "-line" files are drawn
# with lines; the others are solid and most are listed under [outline].
"brave-origin" = "brave-line"
"brave-origin-nightly" = "brave-line"
"brave-browser" = "brave-line"
"dev.zed.Zed" = "zed-line"
"zed" = "zed-line"
"dev.zed.Zed-Preview" = "zed-line"
"com.slack.Slack" = "slack-line"
"org.onlyoffice.desktopeditors" = "onlyoffice-line"
"google-chrome" = "googlechrome-line"
"com.getpostman.Postman" = "postman"
"gimp" = "gimp"
"io.dbeaver.DBeaverCommunity" = "dbeaver"
"com.mongodb.Compass" = "mongodb"
"us.zoom.Zoom" = "zoom-line"
"rustdesk" = "rustdesk-line"
"android-studio" = "androidstudio"
"Android Studio" = "androidstudio"
"com.obsproject.Studio" = "obsstudio"
"com.rtosta.zapzap" = "whatsapp-line"
"org.telegram.desktop" = "telegram-line"
"com.bambulab.BambuStudio" = "bambulab"
"org.vinegarhq.Vinegar" = "roblox-line"
"htop" = "chart-bar-line"
"brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default" = "whatsapp-line"      # WhatsApp Web
"brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default" = "youtubemusic-line"  # YouTube Music

# Files and documents
"org.kde.dolphin" = "dolphin-line"
"okular" = "graphics-viewer-document"
"gwenview" = "view-preview"
"ark" = "package"
"kwrite" = "edit-rename"
"skanpage" = "document-scan"
"spectacle" = "aperture-line"
"kolourpaint" = "draw-brush"

# Browsers and web apps
"brave-amhbndggdfmijhoidhgojjkjpkocaeki-Default" = "food"               # NutriAI

# Communication
"kamoso" = "camera-web"
"dragonplayer" = "media-playback-start"
"haruna" = "media-playback-start"

# Development
"debug-run" = "debug-run"

# Remote access and networks
"krdc" = "screen-share-line"
"scrcpy" = "android-line"   # Android screen mirroring; scrcpy's own launcher names this icon
"org.kde.krdc" = "screen-share-line"
"firewall-config" = "security-high"

# System
"plasmadiscover" = "layout-grid-add-line"
"preferences-system" = "preferences-system"
"hwinfo" = "computer"
"partitionmanager" = "drive-partition"
"org.kde.isoimagewriter" = "drive-removable-media-usb"
"org.kde.kjournaldbrowser" = "view-calendar-journal"
"kwalletmanager" = "wallet-open"
"kfind" = "edit-find"
"input-remapper" = "input-keyboard"
"im-chooser" = "input-keyboard"
"tools-report-bug" = "tools-report-bug"
"preferences-desktop-emoticons" = "preferences-desktop-emoticons"
"start-here-kde-plasma" = "start-here-kde-plasma"
"org.kde.qrca" = "view-barcode-qr"

# Tools, with line glyphs from glyphs/ in place of solid ones
"kmenuedit" = "menu-2-line"
"utilities-system-monitor" = "activity-line"
"accessories-calculator" = "calculator-line"
"accessories-character-map" = "alphabet-latin-line"
"help-browser" = "help-line"
"filelight" = "chart-donut-line"
"nvtop" = "cpu-line"
"elisa" = "music-line"
"org.gnome.NetworkDisplays" = "cast-line"

# Mail and contacts
"kaddressbook" = "view-pim-contacts"
"kontact" = "mail-message"
"org.kde.koko" = "photo"
"kontact-import-wizard" = "document-import"
"sieveeditor" = "view-filter"
"ktnef" = "mail-attachment"

# Not applications: the icons System Settings draws to preview an icon theme.
# Without them the preview of this theme shows Breeze's. "exec" and "document"
# are the names that page tries besides "system-run" and "text-x-generic", and
# hardly anything else asks for them, so launchers and text files keep their
# icons. "folder" and "user-trash" have no such second name: the Trash takes the
# shape wherever it is shown, and "user-trash-full" follows so that it matches.
"exec" = "system-run"
"folder" = "folder"
"document" = "file-text-line"
"user-trash" = "user-trash"
"user-trash-full" = "user-trash-full"

# Other

# How the icons look, per variant. Try a change with
# `katze-mono.py --preview p.svg --set dark.tint=0.3` (`mise run icons:preview`)
# before building: it draws both variants in the Katze colour schemes. The
# owner chose this look on the XPS on 2026-11-26, out of some forty tried.
#
# palette    "brand": each shape in its application's colour from [brand], so
#            that an application is found by its colour. "accent" paints every
#            shape with the accent instead, as the theme did before.
# tint       how much of that colour the shape takes over the background colour.
#            Dark: at 0.72 the colours looked muddy against the panel. Light: the
#            whole colour, or the white glyph is lost on a pastel.
# grey       how much of the text colour lightens the shape. A touch, in the dark,
#            so that a charcoal shape stays apart from the panel.
# edge       how strong the shape's 1 px edge is. None: on a coloured shape the
#            edge only made it look smaller.
# shade      how far the glyph goes from the accent (0) to the text colour (1).
# invert     1 cuts the glyph out of the shape in the background colour: white on
#            colour in the light scheme, where the dark text colour lacked contrast.
# line       the width of the glyph's lines, as a multiple of the base width.
# gradient, highlight, shadow
#            a light top, a light edge along it and a soft shadow. Only a touch:
#            at 0.15 to 0.35 the owner found the icons too deep.
[look.dark]
palette = "brand"
tint = 0.88
grey = 0.04
edge = 0.0
shade = 1.0
line = 1.55
gradient = 0.06
highlight = 0.12
shadow = 0.12

[look.light]
palette = "brand"
tint = 0.95
edge = 0.0
shade = 1.0
invert = 1.0
line = 1.6
gradient = 0.05
highlight = 0.1
shadow = 0.1

# Applications left with their original icon, for any whose tray item still
# takes the shape. Tray items that ask for "<icon>-symbolic" do not need it:
# the theme writes that name with the glyph alone.
[skip]
icons = []

# Solid glyphs drawn as their contour, by file name without ".svg" or
# "-symbolic", so they match the line glyphs. Marks made of many small parts
# (Zed, htop, Inkscape) turn into a tangle and stay solid.
[outline]
glyphs = [
  "postman", "gimp", "dbeaver", "mongodb", "androidstudio", "obsstudio", "bambulab", "mpv",
  "firefox", "kate", "view-calendar-journal", "vlc", "virt-manager",
  "org.freedesktop.GnomeAbrt", "abrt", "wallet-open", "media-playback-start", "draw-brush",
  "security-high", "package",
]

# Size corrections for glyphs that look small next to the others, by file
# name without ".svg". 1 is the normal size.
[scale]
"brave-line" = 1.15

# Each application's colour, for palette = "brand", by its Icon= value or its
# glyph's file name (without ".svg"): its brand's colour as close as possible,
# and for KDE's applications the main colour of their own Breeze icon. Every
# other application takes "default", Breeze's charcoal, so that the ones with
# a colour stand out. [brand.dark] and [brand.light] override a colour in one
# variant.
[brand]
"default" = "#31363b"             # Breeze's charcoal
# Brands
"brave-line" = "#fb542b"          # Brave's orange
"firefox" = "#e8303c"             # the red of Firefox's flame
"googlechrome-line" = "#4285f4"   # Google's blue
"slack-line" = "#4a154b"          # Slack's aubergine
"zed-line" = "#084ccf"
"telegram-line" = "#26a5e4"
"whatsapp-line" = "#25d366"
"zoom-line" = "#0b5cff"
"youtubemusic-line" = "#ff0000"
"onlyoffice-line" = "#ff6f3d"
"postman" = "#ff6c37"
"mongodb" = "#47a248"
"bambulab" = "#00ae42"
"rustdesk-line" = "#024eff"
"gimp" = "#5c5543"
"android-line" = "#3ddc84"        # scrcpy: Android's green
"androidstudio" = "#3ddc84"
"cast-line" = "#4a86cf"           # GNOME Network Displays
# KDE: the main colour of the application's own Breeze icon. Those whose icon
# is dark (System Settings, Konsole, Yakuake, Haruna, KCalc, KDE Connect) are
# not listed: they take "default", the same charcoal.
"layout-grid-add-line" = "#1d99f3" # Discover's bag
"dolphin-line" = "#3daee9"         # Dolphin's folder
"kate" = "#2a8ae2"
"aperture-line" = "#da4b8f"        # Spectacle's magenta
"graphics-viewer-document" = "#2f7dd1" # Okular
"photo" = "#e8606a"                # Photos (Koko)
"screen-share-line" = "#1fa38a"    # KRDC's screen
"package" = "#7f8c8d"              # Ark
"chart-donut-line" = "#2ab27b"     # Filelight's ring
"cpu-line" = "#8e44ad"             # nvtop

[brand.dark]
# On the dark panel the charcoal and the aubergine were too close to it.
"default" = "#56606c"
"slack-line" = "#7c3085"
